<h2 mat-dialog-title>{{ datos.menu ? 'Editar menú' : 'Nuevo menú' }}</h2>

<form [formGroup]="form" (ngSubmit)="guardar()">
  <mat-dialog-content style="display:flex; flex-direction:column; gap:12px; min-width:320px;">
    <mat-form-field appearance="outline">
      <mat-label>Módulo</mat-label>
      <mat-select formControlName="idModulo">
        @for (modulo of modulos; track modulo.idModulo) {
          <mat-option [value]="modulo.idModulo">{{ modulo.nombre }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Nombre</mat-label>
      <input matInput formControlName="nombre" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Orden en el menú</mat-label>
      <input matInput type="number" formControlName="ordenMenu" />
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancelar()">Cancelar</button>
    <button mat-flat-button type="submit" [disabled]="!modulos.length">Guardar</button>
  </mat-dialog-actions>
</form>
