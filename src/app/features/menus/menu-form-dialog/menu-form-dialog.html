<h2 mat-dialog-title>{{ datos.menu ? 'Editar menú' : 'Nuevo menú' }}</h2>

<form [formGroup]="form" (ngSubmit)="guardar()">
  <mat-dialog-content style="min-width: 340px;">
    <div class="form-grid">
      <div class="field form-grid__full">
        <label class="field__label" for="idModulo">Módulo</label>
        <div class="field__control">
          <select id="idModulo" formControlName="idModulo">
            <option [ngValue]="null" disabled>Selecciona un módulo…</option>
            @for (modulo of modulos; track modulo.idModulo) {
              <option [ngValue]="modulo.idModulo">{{ modulo.nombre }}</option>
            }
          </select>
        </div>
      </div>

      <div class="field form-grid__full">
        <label class="field__label" for="nombre">Nombre</label>
        <div class="field__control">
          <input id="nombre" formControlName="nombre" placeholder="Ej. Parametros Generales" />
        </div>
      </div>

      <div class="field">
        <label class="field__label" for="ordenMenu">Orden en el menú</label>
        <div class="field__control">
          <input id="ordenMenu" type="number" formControlName="ordenMenu" />
        </div>
      </div>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button type="button" class="btn btn--ghost" (click)="cancelar()">Cancelar</button>
    <button type="submit" class="btn btn--primary" [disabled]="!modulos.length">Guardar</button>
  </mat-dialog-actions>
</form>
