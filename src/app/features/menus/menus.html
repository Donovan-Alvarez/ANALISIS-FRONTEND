<div style="padding: 16px; display:flex; justify-content:flex-end;">
  <button mat-flat-button (click)="nuevoMenu()">
    <mat-icon>add</mat-icon>
    Nuevo menú
  </button>
</div>

<table mat-table [dataSource]="menus()" class="mat-elevation-z2">

  <ng-container matColumnDef="nombre">
    <th mat-header-cell *matHeaderCellDef>Nombre</th>
    <td mat-cell *matCellDef="let menu">{{ menu.nombre }}</td>
  </ng-container>

  <ng-container matColumnDef="ordenMenu">
    <th mat-header-cell *matHeaderCellDef>Orden</th>
    <td mat-cell *matCellDef="let menu">{{ menu.ordenMenu }}</td>
  </ng-container>

  <ng-container matColumnDef="nombreModulo">
    <th mat-header-cell *matHeaderCellDef>Módulo</th>
    <td mat-cell *matCellDef="let menu">{{ menu.nombreModulo }}</td>
  </ng-container>

  <ng-container matColumnDef="acciones">
    <th mat-header-cell *matHeaderCellDef>Acciones</th>
    <td mat-cell *matCellDef="let menu">
      <button mat-icon-button (click)="editarMenu(menu)">
        <mat-icon>edit</mat-icon>
      </button>
      <button mat-icon-button (click)="eliminarMenu(menu)">
        <mat-icon>delete</mat-icon>
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="columnas"></tr>
  <tr mat-row *matRowDef="let row; columns: columnas"></tr>
</table>
