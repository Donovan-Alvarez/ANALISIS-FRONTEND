<h2 mat-dialog-title>{{ datos.sucursal ? 'Editar sucursal' : 'Nueva sucursal' }}</h2>

<form [formGroup]="form" (ngSubmit)="guardar()">
  <mat-dialog-content style="display:flex; flex-direction:column; gap:12px; min-width:320px;">
    <mat-form-field appearance="outline">
      <mat-label>Empresa</mat-label>
      <mat-select formControlName="idEmpresa">
        @for (empresa of empresas; track empresa.idEmpresa) {
          <mat-option [value]="empresa.idEmpresa">{{ empresa.nombre }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Nombre</mat-label>
      <input matInput formControlName="nombre" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Dirección</mat-label>
      <input matInput formControlName="direccion" />
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancelar()">Cancelar</button>
    <button mat-flat-button type="submit" [disabled]="!empresas.length">Guardar</button>
  </mat-dialog-actions>
</form>
