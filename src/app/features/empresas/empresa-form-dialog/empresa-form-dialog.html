<h2 mat-dialog-title>{{ empresaExistente ? 'Editar empresa' : 'Nueva empresa' }}</h2>

<form [formGroup]="form" (ngSubmit)="guardar()">
  <mat-dialog-content style="display:flex; flex-direction:column; gap:12px; min-width:320px;">
    <mat-form-field appearance="outline">
      <mat-label>Nombre</mat-label>
      <input matInput formControlName="nombre" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Dirección</mat-label>
      <input matInput formControlName="direccion" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>NIT</mat-label>
      <input matInput formControlName="nit" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Mayúsculas mínimas</mat-label>
      <input matInput type="number" formControlName="passwordCantidadMayusculas" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Minúsculas mínimas</mat-label>
      <input matInput type="number" formControlName="passwordCantidadMinusculas" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Números mínimos</mat-label>
      <input matInput type="number" formControlName="passwordCantidadNumeros" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Caracteres especiales mínimos</mat-label>
      <input matInput type="number" formControlName="passwordCantidadCaracteresEspeciales" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Longitud mínima</mat-label>
      <input matInput type="number" formControlName="passwordLargo" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Intentos antes de bloquear</mat-label>
      <input matInput type="number" formControlName="passwordIntentosAntesDeBloquear" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Días de vigencia</mat-label>
      <input matInput type="number" formControlName="passwordCantidadCaducidadDias" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Preguntas de recuperación</mat-label>
      <input matInput type="number" formControlName="passwordCantidadPreguntasValidar" />
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancelar()">Cancelar</button>
    <button mat-flat-button type="submit">Guardar</button>
  </mat-dialog-actions>
</form>
