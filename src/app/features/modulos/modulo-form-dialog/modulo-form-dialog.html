<h2 mat-dialog-title>{{ moduloExistente ? 'Editar módulo' : 'Nuevo módulo' }}</h2>

<form [formGroup]="form" (ngSubmit)="guardar()">
  <mat-dialog-content style="display:flex; flex-direction:column; gap:12px; min-width:320px;">
    <mat-form-field appearance="outline">
      <mat-label>Nombre</mat-label>
      <input matInput formControlName="nombre" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Orden en el menú</mat-label>
      <input matInput type="number" formControlName="ordenMenu" />
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancelar()">Cancelar</button>
    <button mat-flat-button type="submit">Guardar</button>
  </mat-dialog-actions>
</form>
