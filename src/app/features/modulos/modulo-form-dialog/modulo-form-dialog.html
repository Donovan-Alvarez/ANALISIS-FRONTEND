<h2 mat-dialog-title>{{ moduloExistente ? 'Editar módulo' : 'Nuevo módulo' }}</h2>

<form [formGroup]="form" (ngSubmit)="guardar()">
  <mat-dialog-content style="min-width: 340px;">
    <div class="form-grid">
      <div class="field form-grid__full">
        <mat-form-field appearance="outline" floatLabel="always" subscriptSizing="dynamic">
          <mat-label>Nombre</mat-label>
          <input matInput id="nombre" formControlName="nombre" placeholder="Ej. Seguridad" />
        </mat-form-field>
      </div>

      <div class="field">
        <mat-form-field appearance="outline" floatLabel="always" subscriptSizing="dynamic">
          <mat-label>Orden en el menú</mat-label>
          <input matInput id="ordenMenu" type="number" formControlName="ordenMenu" />
        </mat-form-field>
      </div>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button type="button" class="btn btn--ghost" (click)="cancelar()">Cancelar</button>
    <button type="submit" class="btn btn--primary">Guardar</button>
  </mat-dialog-actions>
</form>
