<div style="padding: 16px; display:flex; justify-content:flex-end;">
  <button mat-flat-button (click)="nuevoModulo()">
    <mat-icon>add</mat-icon>
    Nuevo módulo
  </button>
</div>

<table mat-table [dataSource]="modulos()" class="mat-elevation-z2">

  <ng-container matColumnDef="nombre">
    <th mat-header-cell *matHeaderCellDef>Nombre</th>
    <td mat-cell *matCellDef="let modulo">{{ modulo.nombre }}</td>
  </ng-container>

  <ng-container matColumnDef="ordenMenu">
    <th mat-header-cell *matHeaderCellDef>Orden</th>
    <td mat-cell *matCellDef="let modulo">{{ modulo.ordenMenu }}</td>
  </ng-container>

  <ng-container matColumnDef="acciones">
    <th mat-header-cell *matHeaderCellDef>Acciones</th>
    <td mat-cell *matCellDef="let modulo">
      <button mat-icon-button (click)="editarModulo(modulo)">
        <mat-icon>edit</mat-icon>
      </button>
      <button mat-icon-button (click)="eliminarModulo(modulo)">
        <mat-icon>delete</mat-icon>
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="columnas"></tr>
  <tr mat-row *matRowDef="let row; columns: columnas"></tr>
</table>
