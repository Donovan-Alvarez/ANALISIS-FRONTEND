<h2 mat-dialog-title>{{ datos.opcion ? 'Editar opción' : 'Nueva opción' }}</h2>

<form [formGroup]="form" (ngSubmit)="guardar()">
  <mat-dialog-content style="display:flex; flex-direction:column; gap:12px; min-width:320px;">
    <mat-form-field appearance="outline">
      <mat-label>Menú</mat-label>
      <mat-select formControlName="idMenu">
        @for (menu of menus; track menu.idMenu) {
          <mat-option [value]="menu.idMenu">{{ menu.nombre }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Nombre</mat-label>
      <input matInput formControlName="nombre" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Página</mat-label>
      <mat-select formControlName="pagina">
        @for (pagina of paginas; track pagina) {
          <mat-option [value]="pagina">{{ pagina }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Orden en el menú</mat-label>
      <input matInput type="number" formControlName="ordenMenu" />
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancelar()">Cancelar</button>
    <button mat-flat-button type="submit" [disabled]="!menus.length">Guardar</button>
  </mat-dialog-actions>
</form>
