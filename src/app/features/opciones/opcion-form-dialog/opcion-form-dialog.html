<h2 mat-dialog-title>{{ datos.opcion ? 'Editar opción' : 'Nueva opción' }}</h2>

<form [formGroup]="form" (ngSubmit)="guardar()">
  <mat-dialog-content style="min-width: 340px;">
    <div class="form-grid">
      <div class="field form-grid__full">
        <mat-form-field appearance="outline" floatLabel="always" subscriptSizing="dynamic">
          <mat-label>Menú</mat-label>
          <mat-select id="idMenu" formControlName="idMenu" placeholder="Selecciona un menú…">
            @for (menu of menus; track menu.idMenu) {
              <mat-option [value]="menu.idMenu">{{ menu.nombre }}</mat-option>
            }
          </mat-select>
        </mat-form-field>
      </div>

      <div class="field form-grid__full">
        <mat-form-field appearance="outline" floatLabel="always" subscriptSizing="dynamic">
          <mat-label>Nombre</mat-label>
          <input matInput id="nombre" formControlName="nombre" placeholder="Ej. Empresas" />
        </mat-form-field>
      </div>

      <div class="field">
        <mat-form-field appearance="outline" floatLabel="always" subscriptSizing="dynamic">
          <mat-label>Página (ruta)</mat-label>
          <mat-select id="pagina" formControlName="pagina" placeholder="Selecciona una página…">
            @for (pagina of paginas; track pagina) {
              <mat-option [value]="pagina">{{ pagina }}</mat-option>
            }
          </mat-select>
        </mat-form-field>
      </div>

      <div class="field">
        <mat-form-field appearance="outline" floatLabel="always" subscriptSizing="dynamic">
          <mat-label>Orden en el menú</mat-label>
          <input matInput appSeleccionarAlEnfocar id="ordenMenu" type="number" formControlName="ordenMenu" />
        </mat-form-field>
      </div>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button type="button" class="btn btn--ghost" (click)="cancelar()">Cancelar</button>
    <button type="submit" class="btn btn--primary" [disabled]="!menus.length">Guardar</button>
  </mat-dialog-actions>
</form>
