<h2 mat-dialog-title>{{ datos.opcion ? 'Editar opción' : 'Nueva opción' }}</h2>

<form [formGroup]="form" (ngSubmit)="guardar()">
  <mat-dialog-content style="min-width: 340px;">
    <div class="form-grid">
      <div class="field form-grid__full">
        <label class="field__label" for="idMenu">Menú</label>
        <div class="field__control">
          <select id="idMenu" formControlName="idMenu">
            <option [ngValue]="null" disabled>Selecciona un menú…</option>
            @for (menu of menus; track menu.idMenu) {
              <option [ngValue]="menu.idMenu">{{ menu.nombre }}</option>
            }
          </select>
        </div>
      </div>

      <div class="field form-grid__full">
        <label class="field__label" for="nombre">Nombre</label>
        <div class="field__control">
          <input id="nombre" formControlName="nombre" placeholder="Ej. Empresas" />
        </div>
      </div>

      <div class="field">
        <label class="field__label" for="pagina">Página (ruta)</label>
        <div class="field__control">
          <select id="pagina" formControlName="pagina">
            <option value="" disabled>Selecciona una página…</option>
            @for (pagina of paginas; track pagina) {
              <option [value]="pagina">{{ pagina }}</option>
            }
          </select>
        </div>
      </div>

      <div class="field">
        <label class="field__label" for="ordenMenu">Orden en el menú</label>
        <div class="field__control">
          <input id="ordenMenu" type="number" formControlName="ordenMenu" />
        </div>
      </div>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button type="button" class="btn btn--ghost" (click)="cancelar()">Cancelar</button>
    <button type="submit" class="btn btn--primary" [disabled]="!menus.length">Guardar</button>
  </mat-dialog-actions>
</form>
