<div style="padding: 16px; display:flex; justify-content:flex-end;">
  <button mat-flat-button (click)="nuevaOpcion()">
    <mat-icon>add</mat-icon>
    Nueva opción
  </button>
</div>

<table mat-table [dataSource]="opciones()" class="mat-elevation-z2">

  <ng-container matColumnDef="nombre">
    <th mat-header-cell *matHeaderCellDef>Nombre</th>
    <td mat-cell *matCellDef="let opcion">{{ opcion.nombre }}</td>
  </ng-container>

  <ng-container matColumnDef="ordenMenu">
    <th mat-header-cell *matHeaderCellDef>Orden</th>
    <td mat-cell *matCellDef="let opcion">{{ opcion.ordenMenu }}</td>
  </ng-container>

  <ng-container matColumnDef="pagina">
    <th mat-header-cell *matHeaderCellDef>Página</th>
    <td mat-cell *matCellDef="let opcion">{{ opcion.pagina }}</td>
  </ng-container>

  <ng-container matColumnDef="nombreMenu">
    <th mat-header-cell *matHeaderCellDef>Menú</th>
    <td mat-cell *matCellDef="let opcion">{{ opcion.nombreMenu }}</td>
  </ng-container>

  <ng-container matColumnDef="acciones">
    <th mat-header-cell *matHeaderCellDef>Acciones</th>
    <td mat-cell *matCellDef="let opcion">
      <button mat-icon-button (click)="editarOpcion(opcion)">
        <mat-icon>edit</mat-icon>
      </button>
      <button mat-icon-button (click)="eliminarOpcion(opcion)">
        <mat-icon>delete</mat-icon>
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="columnas"></tr>
  <tr mat-row *matRowDef="let row; columns: columnas"></tr>
</table>
